[project]
name = "scimperative-workshop-01"
version = "0.2.0"
description = "Workshop 01: Calibrating Expectations for the Raspberry Pi 5 + Hailo AI HAT+ (Hailo-8L, 13 TOPS)"
readme = "README.md"
# Raspberry Pi OS Bookworm ships Python 3.11, which is what the apt python3-hailort bindings target.
requires-python = ">=3.11,<3.13"
dependencies = [
    # numpy is pinned <2: the apt-installed HailoRT python extension is built against numpy 1.x ABI.
    "numpy>=1.26,<2",
    # opencv >=4.12 requires numpy>=2, so cap it.
    "opencv-python-headless>=4.8,<4.12",
    "matplotlib>=3.8,<3.11",
]

[project.optional-dependencies]
# mAP evaluation (COCOeval)
eval = ["pycocotools>=2.0.7"]
# FP32 ONNX baseline for the accuracy delta
fp32 = ["onnxruntime>=1.17"]

[tool.uv]
# This is a scripts project, not an installable package.
package = false
